<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photobooth</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fdf2f8; color: #333; text-align: center; margin: 0; padding: 16px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; align-items: flex-start; }
  .cam { position: relative; max-width: 480px; width: 100%; }
  video { width: 100%; border-radius: 12px; transform: scaleX(-1); background: #000; }
  #count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 120px; color: #fff; text-shadow: 0 0 12px #000; pointer-events: none; }
  button { font-size: 18px; padding: 10px 24px; border: 0; border-radius: 999px; background: #ec4899; color: #fff; cursor: pointer; margin: 8px 4px; }
  button:disabled { opacity: .5; }
  canvas { max-height: 80vh; max-width: 100%; box-shadow: 0 4px 16px #0003; }
</style>
</head>
<body>
<h1>📸 Photobooth</h1>
<div class="wrap">
  <div class="cam">
    <video id="video" autoplay playsinline muted></video>
    <div id="count"></div>
    <div>
      <label>Màu khung <input type="color" id="color" value="#ffffff"></label><br>
      <button id="shoot">Chụp 4 tấm</button>
      <button id="save" disabled>Tải về</button>
    </div>
  </div>
  <canvas id="strip"></canvas>
</div>
<script>
const SHOTS = 4, W = 400, H = 300, PAD = 20, FOOTER = 60;
const video = document.getElementById('video');
const count = document.getElementById('count');
const strip = document.getElementById('strip');
const ctx = strip.getContext('2d');
const shootBtn = document.getElementById('shoot');
const saveBtn = document.getElementById('save');
const photos = [];

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
  .then(s => video.srcObject = s)
  .catch(e => alert('Không mở được camera: ' + e.message));

const wait = ms => new Promise(r => setTimeout(r, ms));

function grab() {
  // crop frame to W:H, mirrored like the preview
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(W / vw, H / vh);
  const sw = W / scale, sh = H / scale;
  g.translate(W, 0); g.scale(-1, 1);
  g.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, W, H);
  return c;
}

function draw() {
  strip.width = W + PAD * 2;
  strip.height = PAD + SHOTS * (H + PAD) + FOOTER;
  ctx.fillStyle = document.getElementById('color').value;
  ctx.fillRect(0, 0, strip.width, strip.height);
  photos.forEach((p, i) => ctx.drawImage(p, PAD, PAD + i * (H + PAD)));
  ctx.fillStyle = '#888';
  ctx.font = '20px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(new Date().toLocaleDateString('vi-VN'), strip.width / 2, strip.height - FOOTER / 2);
}

shootBtn.onclick = async () => {
  shootBtn.disabled = saveBtn.disabled = true;
  photos.length = 0;
  for (let i = 0; i < SHOTS; i++) {
    for (let n = 3; n > 0; n--) { count.textContent = n; await wait(1000); }
    count.textContent = '';
    photos.push(grab());
    draw();
    await wait(300);
  }
  shootBtn.disabled = saveBtn.disabled = false;
};

document.getElementById('color').oninput = () => photos.length && draw();

saveBtn.onclick = () => {
  const a = document.createElement('a');
  a.download = 'photobooth.png';
  a.href = strip.toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
